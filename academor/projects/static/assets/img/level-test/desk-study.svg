<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" fill="none" aria-hidden="true">
  <!-- Top-down study desk: a student writing in a notebook (tests page hero background). -->
  <defs>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" stroke="#3c4862" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="pool" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#6b7591"/>
      <stop offset="1" stop-color="#535c78"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c85a24"/>
      <stop offset="1" stop-color="#a9461a"/>
    </linearGradient>
  </defs>

  <!-- room -->
  <rect width="500" height="340" fill="#2d374c"/>
  <rect width="500" height="230" fill="url(#grid)"/>
  <!-- lamp light on the desk -->
  <circle cx="250" cy="142" r="214" fill="url(#pool)"/>
  <circle cx="250" cy="142" r="214" fill="url(#grid)" opacity="0.35"/>
  <!-- floor -->
  <path d="M0 230H500V340H0Z" fill="url(#floor)"/>
  <g stroke="#b54d1c" stroke-width="2" opacity="0.55">
    <path d="M0 262H500M0 296H500M0 326H500"/>
  </g>
  <ellipse cx="262" cy="300" rx="190" ry="70" fill="#e07a3a" opacity="0.55"/>

  <!-- vinyl record -->
  <circle cx="250" cy="14" r="74" fill="#15171c"/>
  <g stroke="#262931" stroke-width="1.2">
    <circle cx="250" cy="14" r="62"/>
    <circle cx="250" cy="14" r="50"/>
    <circle cx="250" cy="14" r="38"/>
  </g>
  <circle cx="250" cy="14" r="15" fill="#23262d"/>

  <!-- wall calendar -->
  <rect x="36" y="-6" width="80" height="36" rx="2" fill="#f1d7a2"/>
  <g stroke="#c8402d" stroke-width="2" stroke-linecap="round">
    <path d="M48 6l7 7M55 6l-7 7M70 12l7 7M77 12l-7 7M92 4l7 7M99 4l-7 7"/>
  </g>
  <g stroke="#b99a63" stroke-width="0.8"><path d="M36 10H116M36 20H116M62 -6V30M88 -6V30"/></g>

  <!-- crumpled paper -->
  <path d="M104 44l12-9 14 4 6 12-8 10-15 1-9-8z" fill="#f4efe4"/>
  <path d="M112 44l10 3-4 7M124 40l3 9" stroke="#2d374c" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M146 38l13-7 15 5 3 13-11 8-14-1-6-9z" fill="#f4efe4"/>
  <path d="M153 39l9 5 6-6M160 50l6-3" stroke="#2d374c" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M38 252l12-8 13 4 4 11-9 8-13-1-7-6z" fill="#f4efe4"/>
  <path d="M57 268l10-6 12 4 2 10-9 7-12-2-4-7z" fill="#f4efe4"/>
  <path d="M46 253l7 5M64 270l6 4" stroke="#2d374c" stroke-width="1.4" stroke-linecap="round"/>

  <!-- candle dish -->
  <circle cx="68" cy="92" r="27" fill="#e7a1a7"/>
  <circle cx="68" cy="92" r="19" fill="#f2bcbe"/>
  <path d="M68 78c6 6 7 12 2 17-6 4-12 0-11-6 1-5 6-6 9-11z" fill="#f08a2c"/>
  <path d="M68 86c3 3 3 6 1 8-3 2-6 0-5-3 1-2 3-3 4-5z" fill="#ffd36a"/>

  <!-- apple -->
  <circle cx="92" cy="164" r="23" fill="#c7302a"/>
  <path d="M80 152c4-4 9-5 13-3" stroke="#e9665a" stroke-width="4" stroke-linecap="round"/>
  <path d="M95 142c1-5 4-8 8-9" stroke="#3a2a1e" stroke-width="2.4" stroke-linecap="round"/>

  <!-- open notebook -->
  <path d="M102 86l76-6 13 110-78 4z" fill="#f6ecd8"/>
  <path d="M178 72l108 25-24 115-71-22z" fill="#f2e5cb"/>
  <path d="M178 72l13 118" stroke="#d9c7a2" stroke-width="1.5"/>
  <g stroke="#2a2b30" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <path d="M114 100l46-3M114 110l52-4M115 120l40-3M116 130l50-4M117 140l34-3"/>
    <path d="M118 168l40-3M119 178l30-2"/>
    <path d="M196 92l70 16M194 103l64 14M193 114l70 16M191 125l50 11M190 136l66 15M189 147l44 10"/>
  </g>
  <path d="M124 92v94" stroke="#c46a6a" stroke-width="1.2" opacity="0.7"/>
  <rect x="128" y="102" width="5" height="62" rx="2" fill="#e0567a" transform="rotate(-3 130 133)"/>

  <!-- sticky note -->
  <rect x="290" y="78" width="34" height="30" fill="#f2c443" transform="rotate(8 307 93)"/>
  <path d="M296 90l18 3M295 98l14 2" stroke="#c99a1d" stroke-width="1.2"/>

  <!-- coffee mug -->
  <rect x="384" y="132" width="10" height="16" rx="4" fill="#2a2d36" transform="rotate(30 389 140)"/>
  <circle cx="366" cy="122" r="27" fill="#2a2d36"/>
  <circle cx="366" cy="122" r="21" fill="#e38c1f"/>
  <path d="M356 112c5-4 12-4 17 0" stroke="#f3b04e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- letter and envelope -->
  <rect x="378" y="-8" width="104" height="58" rx="2" fill="#f6eedb" transform="rotate(8 430 21)"/>
  <g stroke="#2a2b30" stroke-width="1.3" stroke-linecap="round" opacity="0.7">
    <path d="M394 8l60 8M392 18l70 9M391 28l50 7"/>
  </g>
  <path d="M368 54l92-10 6 40-92 10z" fill="#efe2c4"/>
  <path d="M368 54l50 28 42-38" stroke="#cdb88f" stroke-width="1.5"/>
  <!-- measuring tape -->
  <path d="M352 28c30 4 44 30 60 52s40 26 54 20" stroke="#ecd9a6" stroke-width="4" stroke-dasharray="3 3"/>

  <!-- pink notebook and pencil -->
  <rect x="420" y="108" width="68" height="84" rx="3" fill="#c88379" transform="rotate(14 454 150)"/>
  <rect x="452" y="118" width="20" height="7" rx="2" fill="#2a2d36" transform="rotate(14 462 121)"/>
  <path d="M417 184l2 30" stroke="#f0c13a" stroke-width="4" stroke-linecap="round"/>

  <!-- the student: sweater, arm, hand with pen, hair -->
  <path d="M96 340c4-46 22-88 58-112 30-18 74-20 108-16 40 4 82 16 110 46 22 24 30 52 32 82z" fill="#2e5a5b"/>
  <path d="M120 340c6-34 20-60 42-76l18 76z" fill="#264c4d"/>
  <path d="M100 250c14-40 40-70 70-84l26 20c-26 16-48 44-62 78z" fill="#2e5a5b"/>
  <path d="M146 176c8-14 22-24 38-26 14 0 24 8 26 18 1 10-8 16-18 16l-30 6c-8 2-16-4-16-14z" fill="#efb59c"/>
  <path d="M150 157l96-5" stroke="#1c1e23" stroke-width="5" stroke-linecap="round"/>
  <path d="M244 152l8-0.4" stroke="#c9c9c9" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="292" cy="228" rx="64" ry="58" fill="#5b3a29"/>
  <g stroke="#3d261b" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M250 212c16-20 44-26 66-14M262 236c18-16 44-18 66-6M248 250c10-8 22-12 34-10"/>
    <path d="M300 176c-8 18-6 36 4 52"/>
  </g>
  <path d="M232 214c6-22 24-36 46-38" stroke="#7a5238" stroke-width="3" stroke-linecap="round"/>
</svg>
