{% extends "base.html" %}
{% load static i18n %}

{% block body_attrs %} class="bg-light"{% endblock %}

{% block content %}
    <main id="main-content" class="container-xxl py-5 text-center">
        <div class="py-5 px-3">
            <p class="text-muted text-uppercase small mb-2">404</p>
            <h1 class="h2 mb-3">{% trans "Page not found" %}</h1>
            <p class="text-muted mb-4 col-lg-8 mx-auto">{% trans "The link may be broken or the page may have been removed." %}</p>
            <a href="{% url 'projects:home-page' %}" class="btn btn-primary px-4 rounded-pill">{% trans "Back to home" %}</a>
        </div>
    </main>
{% endblock %}
