{% load static i18n %}
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css"></noscript>
<div class="about-vp about-intro-image-card" data-about-vp>
    <div class="about-vp__cover" aria-hidden="false">
        {% if about.video_cover %}
        <img
            src="{{ about.video_cover }}"
            alt="{% trans 'About Academor video' %}"
            class="about-vp__cover-img"
            {% if home_about_block %}loading="eager" fetchpriority="high"{% else %}loading="lazy"{% endif %}
            decoding="async"
        >
        {% endif %}
        <button class="about-vp__play-btn" type="button" aria-label="{% trans 'Play video' %}">
            <span class="about-vp__ripple"></span>
            <svg class="about-vp__play-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5v14l11-7z"/>
            </svg>
        </button>
    </div>

    <video
        class="about-vp__video"
        playsinline
        preload="metadata"
        {% if about.video_cover %}poster="{{ about.video_cover }}"{% endif %}
    >
        <source src="{{ about.video }}" type="video/mp4">
    </video>
</div>
<script defer src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js"></script>
<script defer src="{% static 'assets/js/about_video_player.js' %}" data-plyr-icon="{% static 'assets/vendor/plyr.svg' %}"></script>
