{# Inline SVG language flags — crisp at any DPR. Usage: {% include "includes/lang_flag.html" with code="az" %} #}
{% if code == "az" %}
<svg class="nav-lang-flag" viewBox="0 0 36 24" width="18" height="12" aria-hidden="true" focusable="false">
  <rect width="36" height="8" y="0" fill="#00B5E2"/>
  <rect width="36" height="8" y="8" fill="#EF3340"/>
  <rect width="36" height="8" y="16" fill="#509E2F"/>
  <circle cx="14.2" cy="12" r="3.35" fill="none" stroke="#fff" stroke-width="1.35"/>
  <circle cx="15.15" cy="12" r="2.7" fill="#EF3340"/>
  <path fill="#fff" d="M20.1 12l-.55-1.55-1.55-.1 1.2-.95-.4-1.5 1.3.75 1.3-.75-.4 1.5 1.2.95-1.55.1z"/>
</svg>
{% elif code == "ru" %}
<svg class="nav-lang-flag" viewBox="0 0 36 24" width="18" height="12" aria-hidden="true" focusable="false">
  <rect width="36" height="8" y="0" fill="#fff"/>
  <rect width="36" height="8" y="8" fill="#0039A6"/>
  <rect width="36" height="8" y="16" fill="#D52B1E"/>
</svg>
{% else %}
<svg class="nav-lang-flag" viewBox="0 0 36 24" width="18" height="12" aria-hidden="true" focusable="false">
  <rect width="36" height="24" fill="#012169"/>
  <path stroke="#fff" stroke-width="4" d="M0 0l36 24M36 0L0 24"/>
  <path stroke="#C8102E" stroke-width="2.2" d="M0 0l36 24M36 0L0 24"/>
  <path stroke="#fff" stroke-width="6.5" d="M18 0v24M0 12h36"/>
  <path stroke="#C8102E" stroke-width="3.5" d="M18 0v24M0 12h36"/>
</svg>
{% endif %}
