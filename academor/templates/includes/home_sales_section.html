{% load i18n %}
{% if sales %}
<section id="home-sales" class="home-sales-section" aria-labelledby="home-sales-heading">
<style>
.home-sales-section {
    position: relative;
    background-color: var(--site-surface, var(--surface));
    overflow: hidden;
}
.home-sales-section__inner {
    position: relative;
    z-index: var(--z-raised);
    padding: clamp(2.25rem, 5vw, 3.25rem) 0 clamp(2.5rem, 6vw, 3.5rem);
}
.home-sales-section__header {
    margin-bottom: clamp(1.35rem, 3vw, 1.85rem);
}
.home-sales-section__eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    margin: 0 0 0.35rem;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent, var(--accent));
}
.home-sales-section__eyebrow::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.75;
}
.home-sales-section__title {
    margin: 0;
    font-size: clamp(1.45rem, 3vw, 2rem);
    font-weight: 800;
    color: var(--bs-primary, var(--foreground));
    letter-spacing: -0.03em;
    line-height: 1.15;
}
.home-sales-section__banners {
    display: grid;
    gap: clamp(1rem, 2.5vw, 1.35rem);
    width: 100%;
}
.discount-banner {
    position: relative;
    width: 100%;
    min-height: clamp(200px, 24vw, 260px);
    max-height: clamp(220px, 28vw, 280px);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgb(var(--primary-rgb) / 0.14);
    background-color: var(--primary, var(--primary));
    box-shadow: 0 8px 24px rgb(var(--primary-rgb) / 0.1);
    transition:
        transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.35s ease;
    will-change: transform;
}
.discount-banner__img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
}
.discount-banner__overlay {
    position: absolute;
    inset: 0;
    z-index: var(--z-raised);
    background-color: rgb(var(--primary-rgb) / 0.78);
    transition: background-color 0.35s ease;
    pointer-events: none;
}
.discount-banner:hover {
    border-color: rgb(var(--primary-rgb) / 0.42);
    transform: translateY(-6px);
    box-shadow: 0 22px 44px rgb(var(--primary-rgb) / 0.22);
}
.discount-banner:hover .discount-banner__overlay {
    background-color: rgb(var(--primary-rgb) / 0.88);
}
.discount-banner:hover .discount-banner__img {
    transform: scale(1.05);
}
.discount-banner--no-image .discount-banner__overlay {
    background-color: rgb(var(--primary-rgb) / 0.28);
}
.discount-banner--no-image:hover .discount-banner__overlay {
    background-color: rgb(var(--primary-rgb) / 0.38);
}
.discount-banner__body {
    position: relative;
    z-index: var(--z-raised-2);
    display: flex;
    flex-direction: row;
    align-items: stretch;
    width: 100%;
    height: 100%;
    min-height: clamp(200px, 24vw, 260px);
    max-height: clamp(220px, 28vw, 280px);
}
.discount-banner__content {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.45rem;
    padding: clamp(1rem, 2.2vw, 1.35rem) clamp(1.1rem, 2.5vw, 1.45rem);
    background-color: transparent;
}
.discount-banner__title {
    margin: 0;
    padding-right: 0;
    font-size: clamp(1.05rem, 2.2vw, 1.35rem);
    font-weight: 800;
    line-height: 1.22;
    color: var(--on-dark);
    text-shadow: 0 2px 14px rgb(var(--overlay-rgb) / 0.35);
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
}
.discount-banner__desc {
    margin: 0;
    max-width: none;
    font-size: clamp(0.84rem, 1.6vw, 0.92rem);
    line-height: 1.45;
    color: rgb(var(--on-dark-rgb) / 0.94);
    text-shadow: 0 1px 10px rgb(var(--overlay-rgb) / 0.28);
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
}
.discount-banner__footer {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem 0.85rem;
    width: 100%;
    margin-top: 0.15rem;
    padding-top: 0;
    flex-shrink: 0;
}
.discount-banner__cta {
    margin: 0 0 0 auto;
    flex-shrink: 0;
}
.discount-banner__deadline--placeholder {
    display: none;
}
.discount-banner__deadline {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    margin: 0;
    min-height: 1.15rem;
    font-size: 0.78rem;
    line-height: 1;
    color: rgb(var(--on-dark-rgb) / 0.78);
    white-space: nowrap;
}
.discount-banner__deadline-icon {
    font-size: 0.68rem;
    color: var(--accent, var(--accent));
    opacity: 0.95;
}
.discount-banner__deadline-label {
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 0.68rem;
    color: rgb(var(--on-dark-rgb) / 0.72);
}
.discount-banner__deadline-sep {
    color: rgb(var(--on-dark-rgb) / 0.35);
    font-weight: 700;
}
.discount-banner__deadline-date {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--on-dark);
    letter-spacing: 0.01em;
}
.discount-banner__badge {
    position: relative;
    z-index: var(--z-raised-3);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    flex-shrink: 0;
    width: clamp(96px, 14vw, 118px);
    min-width: 96px;
    padding: 0.65rem 0.55rem;
    background-color: var(--accent, var(--accent));
    border-left: 1px solid rgb(var(--card-rgb) / 0.22);
    box-shadow: none;
    text-align: center;
    transition: filter 0.35s ease;
}
.discount-banner:hover .discount-banner__badge {
    filter: brightness(1.05);
}
.discount-banner .hbh-see-all,
.discount-banner .hbh-see-all:hover,
.discount-banner .hbh-see-all:focus,
.discount-banner .hbh-see-all:active,
.discount-banner .hbh-see-all:visited {
    background: var(--accent, var(--accent)) !important;
    border-color: var(--accent, var(--accent)) !important;
    color: var(--on-dark) !important;
    box-shadow: 0 4px 18px rgb(var(--accent-rgb) / 0.35);
}
.discount-banner .hbh-see-all:hover,
.discount-banner .hbh-see-all:focus {
    transform: translateY(-2px);
    box-shadow: 0 8px 26px rgb(var(--accent-rgb) / 0.45);
}
.discount-banner .hbh-see-all:hover .bi,
.discount-banner .hbh-see-all:focus .bi {
    transform: translateX(3px);
}
.discount-banner .hbh-see-all:focus-visible {
    outline-color: rgb(var(--accent-rgb) / 0.55);
}
.discount-banner__percent {
    display: block;
    font-size: clamp(1.45rem, 3.2vw, 1.85rem);
    font-weight: 900;
    line-height: 1;
    color: var(--on-dark);
    letter-spacing: -0.03em;
}
.discount-banner__percent-label {
    display: block;
    margin-top: 0.15rem;
    font-size: clamp(0.62rem, 1.4vw, 0.72rem);
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--on-dark);
    white-space: nowrap;
    opacity: 1;
}
@media (prefers-reduced-motion: reduce) {
    .discount-banner,
    .discount-banner__overlay,
    .discount-banner__img,
    .discount-banner__badge,
    .discount-banner .hbh-see-all,
    .discount-banner .hbh-see-all .bi {
        transition: none;
    }
    .discount-banner:hover {
        transform: none;
    }
    .discount-banner:hover .discount-banner__img {
        transform: none;
    }
    .discount-banner .hbh-see-all:hover,
    .discount-banner .hbh-see-all:focus {
        transform: none;
    }
    .discount-banner .hbh-see-all:hover .bi,
    .discount-banner .hbh-see-all:focus .bi {
        transform: none;
    }
}
@media (max-width: 767.98px) {
    .discount-banner,
    .discount-banner__body {
        min-height: clamp(210px, 58vw, 250px);
        max-height: clamp(230px, 62vw, 270px);
    }
    .discount-banner__deadline {
        white-space: normal;
        flex-wrap: wrap;
        row-gap: 0.15rem;
    }
    .discount-banner__body {
        flex-direction: column;
    }
    .discount-banner__badge {
        width: 100%;
        min-width: 0;
        flex-direction: row;
        gap: 0.35rem;
        padding: 0.55rem 0.85rem;
        border-left: 0;
        border-top: 1px solid rgb(var(--card-rgb) / 0.22);
    }
    .discount-banner__percent-label {
        margin-top: 0;
    }
    .discount-banner__desc {
        -webkit-line-clamp: 3;
    }
}
</style>

<div class="home-sales-section__inner">
    <div class="container-xxl">
        <div class="container">
            <header class="home-sales-section__header wow fadeInUp" data-wow-delay="0.05s">
                <p class="home-sales-section__eyebrow">{% trans "Promotions" %}</p>
                <h2 id="home-sales-heading" class="home-sales-section__title">{% trans "Special offers" %}</h2>
            </header>

            <div class="home-sales-section__banners wow fadeInUp" data-wow-delay="0.1s">
                {% for sale in sales %}
                {% include "includes/discount_banner_horizontal.html" with sale=sale %}
                {% endfor %}
            </div>
        </div>
    </div>
</div>
</section>
{% endif %}
