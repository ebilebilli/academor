{% if turnstile_enabled %}
<script>
(function () {
    var sitekey = "{{ turnstile_site_key|escapejs }}";

    function renderDeferred(el) {
        if (!window.turnstile || !el || el.getAttribute("data-turnstile-rendered") === "1") {
            return;
        }
        try {
            turnstile.render(el, {
                sitekey: sitekey,
                theme: "light",
                size: "normal",
            });
            el.setAttribute("data-turnstile-rendered", "1");
        } catch (e) {}
    }

    function loadTurnstileScript(cb) {
        if (window.turnstile) { cb(); return; }
        var s = document.createElement("script");
        s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js";
        s.async = true;
        s.onload = cb;
        document.head.appendChild(s);
    }

    document.addEventListener("DOMContentLoaded", function () {
        // If any Turnstile widget exists on the page, ensure api.js is loaded.
        // - Inline widgets: <div class="cf-turnstile" ...> are auto-rendered by api.js.
        // - Deferred widgets: <div data-turnstile-deferred> need explicit render().
        var hasInline = document.querySelector(".cf-turnstile");
        var deferred = Array.prototype.slice.call(document.querySelectorAll("[data-turnstile-deferred]"));
        if (!hasInline && deferred.length === 0) return;

        loadTurnstileScript(function () {
            deferred.forEach(function (el) { renderDeferred(el); });
        });

        // If a deferred widget is inside a Bootstrap modal, render it when shown too.
        var reviewModal = document.getElementById("reviewFormModal");
        if (reviewModal) {
            reviewModal.addEventListener("shown.bs.modal", function () {
                loadTurnstileScript(function () {
                    deferred.forEach(function (el) { renderDeferred(el); });
                });
            });
        }
    });
})();
</script>
{% endif %}
