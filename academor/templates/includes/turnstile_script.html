{% if turnstile_enabled %}
<script>
(function () {
    var sitekey = "{{ turnstile_site_key|escapejs }}";

    function renderDeferred(el) {
        if (!window.turnstile || !el || el.getAttribute("data-turnstile-rendered") === "1") {
            return;
        }
        try {
            turnstile.render(el, {
                sitekey: sitekey,
                theme: "light",
                size: "normal",
            });
            el.setAttribute("data-turnstile-rendered", "1");
        } catch (e) {}
    }

    function loadTurnstileScript(cb) {
        if (window.turnstile) { cb(); return; }
        var s = document.createElement("script");
        s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js";
        s.async = true;
        s.onload = cb;
        document.head.appendChild(s);
    }

    document.addEventListener("DOMContentLoaded", function () {
        var reviewModal = document.getElementById("reviewFormModal");
        if (!reviewModal) {
            return;
        }
        reviewModal.addEventListener("shown.bs.modal", function () {
            loadTurnstileScript(function () {
                renderDeferred(document.getElementById("review-turnstile"));
            });
        });
    });
})();
</script>
{% endif %}
