{% load i18n %}
<div class="abroad-advantages wow fadeInUp" data-wow-delay="0.12s" aria-labelledby="abroad-advantages-heading">
    <h2 id="abroad-advantages-heading" class="abroad-advantages__title">
        {% if abroad_advantages.title %}{{ abroad_advantages.title }}{% else %}{% trans "Advantages of Studying Abroad" %}{% endif %}
    </h2>
    <ul class="abroad-advantages__grid list-unstyled mb-0">
        {% for item in abroad_advantages.items %}
        <li class="abroad-advantages__item">
            <span class="abroad-advantages__icon" aria-hidden="true">
                {{ item.icon_svg }}
            </span>
            <span class="abroad-advantages__label">{{ item.title }}</span>
        </li>
        {% endfor %}
    </ul>
</div>
