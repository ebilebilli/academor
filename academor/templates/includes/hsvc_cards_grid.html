{% load i18n %}
{% if categories %}
<ul class="hsvc-grid wow fadeInUp" data-wow-delay="0.1s" role="list">
    {% for cat in categories %}
    <li class="hsvc-grid__item">
        <div class="hsvc-card-wrap{% if active_slug == cat.slug %} hsvc-card-wrap--active{% endif %}">
            <a href="{% url 'projects:course-detail' slug=cat.slug %}" class="hsvc-card">
                <span class="hsvc-card__icon" aria-hidden="true">
                    <i class="fa {{ cat.icon }}" aria-hidden="true"></i>
                </span>
                <h3 class="hsvc-card__title">{{ cat.name }}</h3>
                <span class="hsvc-card__arrow" aria-hidden="true"><i class="fa fa-arrow-right"></i></span>
            </a>
        </div>
    </li>
    {% endfor %}
</ul>
{% else %}
<p class="hsvc-empty wow fadeInUp" data-wow-delay="0.1s">{% trans "No categories yet." %}</p>
{% endif %}
