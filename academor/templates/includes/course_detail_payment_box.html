{% load i18n %}
<div class="course-pay-box mb-2">
    <p class="course-pay-box__label mb-0">{% trans "Course fee" %}</p>
    <p class="course-pay-box__price mb-0">{{ course.price }}<span>AZN</span></p>
    <p class="course-pay-box__course mb-0">{{ course.name }}</p>
    <a
        href="{% url 'payment_start' amount=course.price %}?description={{ course.name|urlencode }}"
        class="btn btn-primary rounded-pill px-4 fw-semibold w-100"
    >
        <i class="fas fa-lock me-2 small" aria-hidden="true"></i>{% trans "Pay securely" %}
    </a>
    <p class="course-pay-box__trust mb-0">
        <i class="fas fa-shield-alt" aria-hidden="true"></i>
        <span>{% trans "You will be redirected to the bank's secure payment page. Card details are not stored on our site." %}</span>
    </p>
</div>
