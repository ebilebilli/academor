{% load static %}
<div class="academor-branded-lazy{% if layout %} academor-branded-lazy--{{ layout }}{% endif %}{% if reveal == 'immediate' %} academor-branded-lazy--reveal-immediate{% endif %}" style="--academor-brand-ph: url('{% static 'assets/img/new_logo.webp' %}');" data-academor-lazy-brand>
    {% if mobile_src %}<picture style="display:contents"><source media="(max-width: 767.98px)" srcset="{{ mobile_src }}">{% endif %}
    <img
        src="{{ src }}"
        alt="{{ alt }}"
        {% if width %}width="{{ width }}"{% endif %}
        {% if height %}height="{{ height }}"{% endif %}
        {% if sizes %}sizes="{{ sizes }}"{% endif %}
        {% if srcset %}srcset="{{ srcset }}"{% endif %}
        class="academor-branded-lazy__img{% if img_class %} {{ img_class }}{% endif %}"
        loading="{{ loading }}"
        decoding="{{ decoding }}"
        {% if fetchpriority and fetchpriority != 'auto' %}fetchpriority="{{ fetchpriority }}"{% endif %}
    >
    {% if mobile_src %}</picture>{% endif %}
</div>
