{% load i18n %}
{% if team %}
<div class="position-relative team-carousel-wrap px-lg-1">
    <div class="swiper team-swiper team-carousel">
        <div class="swiper-wrapper">
            {% for member in team %}
            <div class="swiper-slide">
                <div class="team-carousel-item-inner h-100">
                    {% include "includes/team_member_card.html" %}
                </div>
            </div>
            {% endfor %}
        </div>
        <div class="swiper-button-prev" aria-label="{% trans 'Previous' %}"><i class="bi bi-chevron-left" aria-hidden="true"></i></div>
        <div class="swiper-button-next" aria-label="{% trans 'Next' %}"><i class="bi bi-chevron-right" aria-hidden="true"></i></div>
    </div>
    <div class="team-swiper-pagination-outer"></div>
</div>
{% else %}
<div class="alert text-center mb-0" style="background-color: #fff3cd; border-color: #ffecb5; color: #8a6d3b;">
    {% trans "No team members have been added yet." %}
</div>
{% endif %}
