<style>
.hsvc-section {
    position: relative;
    background: linear-gradient(180deg, #f8fafb 0%, #fff 100%);
    overflow: hidden;
}

.hsvc-section::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(255, 84, 20, 0.06) 0%, transparent 70%);
    pointer-events: none;
}

.hsvc-inner {
    position: relative;
    z-index: var(--z-raised);
    padding: clamp(3rem, 6vw, 4.5rem) 0 clamp(3.25rem, 7vw, 4.75rem);
}

.hsvc-section--standalone .hsvc-inner {
    padding-top: clamp(3rem, 8vw, 4.5rem);
    padding-bottom: clamp(4rem, 10vw, 5.5rem);
}

.hsvc-section--courses-page .hsvc-inner {
    padding-top: clamp(2rem, 5vw, 3rem);
    padding-bottom: clamp(2.5rem, 6vw, 3.5rem);
}

.hsvc-header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1.25rem 2rem;
    margin-bottom: clamp(1.75rem, 4vw, 2.5rem);
}

.hsvc-eyebrow {
    display: block;
    margin-bottom: 0.6rem;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent, #ff5414);
}

.hsvc-title {
    margin: 0;
    font-size: clamp(1.65rem, 3.5vw, 2.35rem);
    font-weight: 800;
    color: var(--bs-primary, #00313d) !important;
    letter-spacing: -0.03em;
    line-height: 1.15;
}

.hsvc-title--centered {
    text-align: center;
    margin-bottom: clamp(1.75rem, 4vw, 2.5rem);
}

/* Service cards: image cards. The service photo (first Media image) fills the card, a
   dark gradient at the bottom carries the icon, name and arrow. Without a photo the card
   gets a brand gradient with a large faded icon. */
.hsvc-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin: 0;
    padding: 0;
    list-style: none;
}

@media (min-width: 992px) {
    .hsvc-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
}

.hsvc-grid__item { min-width: 0; }

.hsvc-card-wrap {
    position: relative;
    height: 100%;
    border-radius: 18px;
    overflow: hidden;
    background: #00313D;
    box-shadow: 0 2px 4px rgba(0, 49, 61, 0.06), 0 10px 26px rgba(0, 49, 61, 0.10);
    transition: box-shadow 0.25s ease, translate 0.25s cubic-bezier(0.23, 1, 0.32, 1);
}

.hsvc-card {
    position: relative;
    display: block;
    aspect-ratio: 16 / 11;
    color: #fff;
    text-decoration: none;
    isolation: isolate;
}

.hsvc-card:hover,
.hsvc-card:focus-visible { color: #fff; }

.hsvc-card:focus-visible {
    outline: 3px solid var(--accent, #ff5414);
    outline-offset: -3px;
}

/* picture or brand gradient */
.hsvc-card__media {
    position: absolute;
    inset: 0;
    z-index: -2;
    display: block;
    overflow: hidden;
}

.hsvc-card__media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: scale 0.6s cubic-bezier(0.23, 1, 0.32, 1);
}

.hsvc-card__media--teal { background: linear-gradient(135deg, #0E5060 0%, #00313D 100%); }
.hsvc-card__media--indigo { background: linear-gradient(135deg, #4B3CFF 0%, #2B1F9E 100%); }
.hsvc-card__media--orange { background: linear-gradient(135deg, #FF8A5D 0%, #E04A10 100%); }

.hsvc-card__glyph {
    position: absolute;
    top: 50%;
    right: -6%;
    translate: 0 -62%;
    font-size: clamp(5rem, 9vw, 8.5rem);
    color: rgba(255, 255, 255, 0.16);
    transition: rotate 0.6s cubic-bezier(0.23, 1, 0.32, 1);
}

/* bottom shade so the white title always reads */
.hsvc-card::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(180deg, rgba(0, 24, 32, 0) 35%, rgba(0, 24, 32, 0.55) 70%, rgba(0, 24, 32, 0.85) 100%);
}

.hsvc-card__body {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
}

.hsvc-card__icon {
    display: grid;
    flex: none;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
    font-size: 0.95rem;
    backdrop-filter: blur(6px);
}

.hsvc-card__title {
    flex: 1;
    min-width: 0;
    margin: 0;
    color: #fff;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.25;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
}

.hsvc-card__arrow {
    display: grid;
    flex: none;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #fff;
    color: #00313D;
    font-size: 0.85rem;
    transition: background-color 0.25s ease, color 0.25s ease;
}

.hsvc-card__arrow i { transition: translate 0.25s cubic-bezier(0.23, 1, 0.32, 1); }

.hsvc-card__sale-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--accent, #ff5414);
    color: #fff;
    font-weight: 800;
    line-height: 1;
    box-shadow: 0 6px 16px rgba(255, 84, 20, 0.35);
}

.hsvc-card__sale-percent { font-size: 0.95rem; }
.hsvc-card__sale-percent::after { content: "%"; }
.hsvc-card__sale-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; }

/* hover / focus */
@media (hover: hover) {
    .hsvc-card-wrap:hover { translate: 0 -4px; box-shadow: 0 4px 10px rgba(0, 49, 61, 0.08), 0 18px 40px rgba(0, 49, 61, 0.18); }
    .hsvc-card-wrap:hover .hsvc-card__media img { scale: 1.06; }
    .hsvc-card-wrap:hover .hsvc-card__glyph { rotate: -8deg; }
    .hsvc-card-wrap:hover .hsvc-card__arrow { background: var(--accent, #ff5414); color: #fff; }
    .hsvc-card-wrap:hover .hsvc-card__arrow i { translate: 3px 0; }
}

.hsvc-card-wrap--active { box-shadow: 0 0 0 3px var(--accent, #ff5414), 0 10px 26px rgba(0, 49, 61, 0.14); }
.hsvc-card-wrap--active .hsvc-card__arrow { background: var(--accent, #ff5414); color: #fff; }

.hsvc-empty {
    margin: 0;
    padding: 2rem 1rem;
    text-align: center;
    color: rgba(0, 49, 61, 0.5) !important;
    font-size: 1rem;
    border-radius: 0.85rem;
    background: #fff;
    border: 1px dashed rgba(0, 49, 61, 0.12);
}

@media (max-width: 575.98px) {
    .hsvc-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
    }
    .hsvc-card { aspect-ratio: 1 / 1; }
    .hsvc-card__body { flex-wrap: wrap; gap: 8px; padding: 12px; }
    .hsvc-card__icon { display: none; }
    .hsvc-card__title { flex-basis: 100%; font-size: 0.95rem; }
    .hsvc-card__arrow { width: 30px; height: 30px; font-size: 0.75rem; }
    .hsvc-card__sale-label { display: none; }
}

@media (prefers-reduced-motion: reduce) {
    .hsvc-card-wrap,
    .hsvc-card__media img,
    .hsvc-card__glyph,
    .hsvc-card__arrow i { transition: none; }
}
</style>
