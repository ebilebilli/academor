<style>
.hsvc-section {
    position: relative;
    background: linear-gradient(180deg, #f8fafb 0%, #fff 100%);
    overflow: hidden;
}

.hsvc-section::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(255, 84, 20, 0.06) 0%, transparent 70%);
    pointer-events: none;
}

/* courses / services pages: no band of their own, the cards sit on the page background */
.hsvc-section--courses-page,
.hsvc-section--standalone { background: transparent; }
.hsvc-section--courses-page::before,
.hsvc-section--standalone::before { content: none; }

.hsvc-inner {
    position: relative;
    z-index: var(--z-raised);
    padding: clamp(3rem, 6vw, 4.5rem) 0 clamp(3.25rem, 7vw, 4.75rem);
}

.hsvc-section--standalone .hsvc-inner {
    padding-top: clamp(3rem, 8vw, 4.5rem);
    padding-bottom: clamp(4rem, 10vw, 5.5rem);
}

.hsvc-section--courses-page .hsvc-inner {
    padding-top: clamp(2rem, 5vw, 3rem);
    padding-bottom: clamp(2.5rem, 6vw, 3.5rem);
}

.hsvc-header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1.25rem 2rem;
    margin-bottom: clamp(1.75rem, 4vw, 2.5rem);
}

.hsvc-eyebrow {
    display: block;
    margin-bottom: 0.6rem;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent, #ff5414);
}

.hsvc-title {
    margin: 0;
    font-size: clamp(1.65rem, 3.5vw, 2.35rem);
    font-weight: 800;
    color: var(--bs-primary, #00313d) !important;
    letter-spacing: -0.03em;
    line-height: 1.15;
}

.hsvc-title--centered {
    text-align: center;
    margin-bottom: clamp(1.75rem, 4vw, 2.5rem);
}

/* Service cards: poster cards. Services are illustrated with A4-proportioned posters
   (1:1.414, with their own text), so the frame has that ratio and the poster fills it
   (anchored at the top, so any small ratio difference only trims the bottom edge). The
   service name sits below it on white, not over the artwork. No poster: brand gradient
   with a large icon. */
.hsvc-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin: 0;
    padding: 0;
    list-style: none;
}

@media (min-width: 768px) {
    .hsvc-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
}

@media (min-width: 1200px) {
    .hsvc-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; }
}

.hsvc-grid__item { min-width: 0; }

.hsvc-card-wrap {
    position: relative;
    height: 100%;
    border-radius: 20px;
    overflow: hidden;
    background: #fff;
    /* hairline ring + layered shadow so the card edge reads against the near-white page */
    box-shadow: 0 0 0 1px rgba(0, 49, 61, 0.12), 0 2px 4px rgba(0, 49, 61, 0.08), 0 14px 32px rgba(0, 49, 61, 0.14);
    transition: box-shadow 0.25s ease, translate 0.25s cubic-bezier(0.23, 1, 0.32, 1);
}

.hsvc-card {
    display: flex;
    flex-direction: column;
    height: 100%;
    color: inherit;
    text-decoration: none;
}

.hsvc-card:focus-visible {
    outline: 3px solid var(--accent, #ff5414);
    outline-offset: -3px;
}

/* the poster frame; the shimmer shows until the poster image paints over it */
.hsvc-card__media {
    position: relative;
    display: block;
    aspect-ratio: 210 / 297;
    overflow: hidden;
    background: linear-gradient(100deg, #eef1f4 30%, #f8fafb 50%, #eef1f4 70%) 0 0 / 250% 100%;
    animation: hsvcShimmer 1.4s linear infinite;
}
.hsvc-card__media--teal, .hsvc-card__media--indigo, .hsvc-card__media--orange,
.hsvc-card__media.is-loaded { animation: none; }
@keyframes hsvcShimmer { to { background-position: -150% 0; } }

/* card reveal (scroll-reveal.js marks the wrapper): short fade + lift, keeps the hover transitions */
:where(html.js) .hsvc-card-wrap.scroll-reveal {
    --reveal-distance: 18px;
    transition:
        opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1) var(--reveal-delay, 0ms),
        transform 0.45s cubic-bezier(0.22, 1, 0.36, 1) var(--reveal-delay, 0ms),
        box-shadow 0.25s ease,
        translate 0.25s cubic-bezier(0.23, 1, 0.32, 1);
}

.hsvc-card__poster {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    transition: scale 0.6s cubic-bezier(0.23, 1, 0.32, 1);
}

.hsvc-card__media--teal { background: linear-gradient(160deg, #0E5060 0%, #00313D 100%); }
.hsvc-card__media--indigo { background: linear-gradient(160deg, #4B3CFF 0%, #2B1F9E 100%); }
.hsvc-card__media--orange { background: linear-gradient(160deg, #FF8A5D 0%, #E04A10 100%); }

.hsvc-card__glyph {
    position: absolute;
    top: 50%;
    left: 50%;
    translate: -50% -50%;
    font-size: clamp(4rem, 8vw, 6.5rem);
    color: rgba(255, 255, 255, 0.22);
    transition: rotate 0.6s cubic-bezier(0.23, 1, 0.32, 1);
}

.hsvc-card__sale-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--accent, #ff5414);
    color: #fff;
    font-weight: 800;
    line-height: 1;
    box-shadow: 0 6px 16px rgba(255, 84, 20, 0.35);
}

.hsvc-card__sale-percent { font-size: 0.95rem; }
.hsvc-card__sale-percent::after { content: "%"; }
.hsvc-card__sale-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; }

/* name + arrow under the poster */
.hsvc-card__body {
    display: flex;
    flex: 1;
    align-items: center;
    gap: 10px;
    padding: 14px 14px 14px 16px;
    border-top: 1px solid rgba(0, 49, 61, 0.08);
}

.hsvc-card__title {
    flex: 1;
    min-width: 0;
    margin: 0;
    color: #00313D;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.3;
}

.hsvc-card__arrow {
    display: grid;
    flex: none;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #F4F3FF;
    color: #00313D;
    font-size: 0.8rem;
    transition: background-color 0.25s ease, color 0.25s ease;
}

.hsvc-card__arrow i { transition: translate 0.25s cubic-bezier(0.23, 1, 0.32, 1); }

/* hover / focus */
@media (hover: hover) {
    .hsvc-card-wrap:hover { translate: 0 -4px; box-shadow: 0 0 0 1px rgba(0, 49, 61, 0.16), 0 4px 10px rgba(0, 49, 61, 0.10), 0 22px 44px rgba(0, 49, 61, 0.22); }
    .hsvc-card-wrap:hover .hsvc-card__poster { scale: 1.03; }
    .hsvc-card-wrap:hover .hsvc-card__glyph { rotate: -8deg; }
    .hsvc-card-wrap:hover .hsvc-card__arrow { background: var(--accent, #ff5414); color: #fff; }
    .hsvc-card-wrap:hover .hsvc-card__arrow i { translate: 3px 0; }
}

.hsvc-card-wrap--active { box-shadow: 0 0 0 3px var(--accent, #ff5414), 0 10px 26px rgba(0, 49, 61, 0.14); }
.hsvc-card-wrap--active .hsvc-card__title { color: var(--accent, #ff5414); }
.hsvc-card-wrap--active .hsvc-card__arrow { background: var(--accent, #ff5414); color: #fff; }

.hsvc-empty {
    margin: 0;
    padding: 2rem 1rem;
    text-align: center;
    color: rgba(0, 49, 61, 0.5) !important;
    font-size: 1rem;
    border-radius: 0.85rem;
    background: #fff;
    border: 1px dashed rgba(0, 49, 61, 0.12);
}

@media (max-width: 575.98px) {
    .hsvc-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
    }
    .hsvc-card-wrap { border-radius: 16px; }
    .hsvc-card__body { padding: 10px 10px 10px 12px; gap: 8px; }
    .hsvc-card__title { font-size: 0.88rem; }
    .hsvc-card__arrow { width: 28px; height: 28px; font-size: 0.7rem; }
    .hsvc-card__sale-label { display: none; }
}

@media (prefers-reduced-motion: reduce) {
    .hsvc-card-wrap,
    :where(html.js) .hsvc-card-wrap.scroll-reveal,
    .hsvc-card__poster,
    .hsvc-card__glyph,
    .hsvc-card__arrow i { transition: none; }
    .hsvc-card__media { animation: none; }
}
</style>
