{% load i18n %}
{% if whatsapp_contact_url %}
<a class="{{ link_class|default:'navbar-contact-btn' }}" href="{{ whatsapp_contact_url }}" target="_blank" rel="noopener noreferrer" title="{% trans 'Contact via WhatsApp' %}" aria-label="{% trans 'Contact via WhatsApp' %}">
  <i class="{{ icon_class|default:'bi bi-whatsapp' }}" aria-hidden="true"></i>
  {% if show_label != False %}
  <span class="{{ label_class|default:'navbar-contact-label d-none d-md-inline' }}">{% trans 'Contact' %}</span>
  {% endif %}
</a>
{% else %}
<a class="{{ link_class|default:'navbar-contact-btn' }}" href="{% url 'projects:contact-page' %}" title="{% trans 'Contact' %}" aria-label="{% trans 'Contact' %}">
  <i class="{{ icon_class|default:'bi bi-whatsapp' }}" aria-hidden="true"></i>
  {% if show_label != False %}
  <span class="{{ label_class|default:'navbar-contact-label d-none d-md-inline' }}">{% trans 'Contact' %}</span>
  {% endif %}
</a>
{% endif %}
