{% load i18n %}
<div
  class="portal-quiz-start-modal modal fade"
  data-quiz-start-gate
  data-start-url="{{ start_url }}"
  data-session-ping-url="{% url 'portals:session-ping' %}"
  data-msg-start-error="{% trans 'Could not start the quiz. Please try again.' %}"
  data-msg-session-expired="{% trans 'Your session has expired. Please log in again.' %}"
  tabindex="-1"
  role="dialog"
  aria-modal="true"
  aria-labelledby="quizStartModalTitle"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
>
  <div class="modal-dialog modal-dialog-centered portal-quiz-start-modal__dialog">
    <div class="modal-content portal-quiz-start-modal__content">
      <div class="modal-body portal-quiz-start-modal__body">
        <div class="portal-quiz-start-modal__icon" aria-hidden="true">
          <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h2 class="portal-quiz-start-modal__title" id="quizStartModalTitle">{% trans 'Important' %}</h2>
        <p class="portal-quiz-start-modal__text mb-0">
          {% trans 'If you leave this page or abandon the quiz unfinished, the quiz will be counted as completed.' %}
        </p>
        <div class="portal-quiz-start-modal__actions">
          <button type="button" class="btn btn-primary btn-lg" data-quiz-start-btn>
            <i class="bi bi-play-fill me-1" aria-hidden="true"></i>{% trans 'Start quiz' %}
          </button>
          <a
            class="btn btn-outline-secondary btn-lg"
            href="{% if quiz_cancel_url %}{{ quiz_cancel_url }}{% elif mock_id %}{% url 'portals:student-quiz-cancel' pk=quiz.id %}?mock={{ mock_id }}&next={{ back_url|urlencode }}{% else %}{% url 'portals:student-quiz-cancel' pk=quiz.id %}?next={{ back_url|urlencode }}{% endif %}"
            data-quiz-back-btn
          >
            <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>{% trans 'Go back' %}
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
