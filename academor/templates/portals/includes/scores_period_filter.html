{% load i18n %}
{% if period_tabs or score_groups %}
<section class="s-lessons-filter-panel mb-4" aria-label="{% trans 'Qiymət filterləri' %}">
  {% if score_groups|length > 1 %}
  {% include "portals/includes/student_group_filter.html" with bordered=period_tabs %}
  {% endif %}

  {% if period_tabs %}
  <div class="s-lessons-filter-panel__row s-lessons-filter-panel__row--period{% if score_groups|length > 1 %} s-lessons-filter-panel__row--bordered{% endif %}">
    <span class="s-lessons-filter-panel__label">
      <i class="ti ti-calendar" aria-hidden="true"></i>
      {% trans 'Tarix' %}
    </span>
    <div class="s-lessons-filter-panel__tabs s-lessons-filter-panel__tabs--seg" data-portal-scores-period-tabs role="group" aria-label="{% trans 'Tarix filteri' %}">
      {% for tab in period_tabs %}
      <button
        class="s-filter-tab{% if forloop.first %} is-active{% endif %}"
        type="button"
        data-period="{{ tab.code }}"
        aria-selected="{% if forloop.first %}true{% else %}false{% endif %}"
      >
        {{ tab.label }}
        <span class="s-filter-tab__badge">{{ tab.count }}</span>
      </button>
      {% endfor %}
    </div>
  </div>
  {% endif %}
</section>
{% endif %}
