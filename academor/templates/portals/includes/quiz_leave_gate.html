{% load i18n %}
<div
  class="portal-quiz-start-modal modal fade"
  data-quiz-leave-gate
  tabindex="-1"
  role="dialog"
  aria-modal="true"
  aria-labelledby="quizLeaveModalTitle"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered portal-quiz-start-modal__dialog">
    <div class="modal-content portal-quiz-start-modal__content">
      <div class="modal-body portal-quiz-start-modal__body">
        <div class="portal-quiz-start-modal__icon" aria-hidden="true">
          <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h2 class="portal-quiz-start-modal__title" id="quizLeaveModalTitle">{% trans 'Leave quiz?' %}</h2>
        <p class="portal-quiz-start-modal__text mb-0">
          {% trans 'If you leave this page now, your quiz will be counted as completed.' %}
        </p>
        <div class="portal-quiz-start-modal__actions">
          <button type="button" class="btn btn-primary btn-lg" data-quiz-leave-confirm-btn>
            <i class="bi bi-box-arrow-right me-1" aria-hidden="true"></i>{% trans 'Leave and complete' %}
          </button>
          <button type="button" class="btn btn-outline-secondary btn-lg" data-quiz-leave-cancel-btn>
            {% trans 'Stay on quiz' %}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
