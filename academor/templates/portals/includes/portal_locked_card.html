{% comment %}
Friendly "not open yet" card (instead of a red error alert). Pass title and text.
{% endcomment %}
<div class="portal-locked-card" role="status">
  <div class="portal-locked-card__copy">
    <p class="portal-locked-card__title"><i class="bi bi-lock-fill" aria-hidden="true"></i> {{ title }}</p>
    <p class="portal-locked-card__text">{{ text }}</p>
  </div>
</div>
