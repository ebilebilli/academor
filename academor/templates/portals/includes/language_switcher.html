{% load i18n %}
{% get_current_language as LANG %}
<div class="dropdown portal-lang-dropdown">
  <button class="icon-button dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="{% trans 'Language' %}">
    <span class="portal-lang-code">{{ LANG|upper }}</span>
  </button>
  <ul class="dropdown-menu dropdown-menu-end portal-dropdown-menu">
    <li>
      <form action="{% url 'set_language' %}" method="post" class="portal-lang-form">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <input type="hidden" name="language" value="az">
        <button type="submit" class="dropdown-item portal-lang-option{% if LANG == 'az' %} active{% endif %}" aria-label="{% trans 'Azerbaijani' %}">AZ</button>
      </form>
    </li>
    <li>
      <form action="{% url 'set_language' %}" method="post" class="portal-lang-form">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <input type="hidden" name="language" value="en">
        <button type="submit" class="dropdown-item portal-lang-option{% if LANG == 'en' %} active{% endif %}" aria-label="{% trans 'English' %}">EN</button>
      </form>
    </li>
    <li>
      <form action="{% url 'set_language' %}" method="post" class="portal-lang-form">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <input type="hidden" name="language" value="ru">
        <button type="submit" class="dropdown-item portal-lang-option{% if LANG == 'ru' %} active{% endif %}" aria-label="{% trans 'Russian' %}">RU</button>
      </form>
    </li>
  </ul>
</div>
