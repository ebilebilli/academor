services:
  db:
    image: postgres:15-alpine
    container_name: academor_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - academor_net

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: academor_web
    env_file:
      - .env
    # --chdir: ş Module path akademor/academor/ ilə düz uyğunlaşır (Dockerfile-la eyni)
    command:
      [
        "gunicorn",
        "--chdir",
        "academor",
        "academor.wsgi:application",
        "--bind",
        "0.0.0.0:8000",
        "--workers",
        "2",
        "--timeout",
        "60",
        "--access-logfile",
        "-",
        "--error-logfile",
        "-",
      ]
    volumes:
      - ..:/app
      - ../academor/staticfiles:/app/academor/staticfiles  # collectstatic mount
      - ../academor/media:/app/academor/media               # media mount
    expose:
      - "8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      ADMIN_URL: ${ADMIN_URL}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      UNITED_PAYMENT_AUTH_URL: ${UNITED_PAYMENT_AUTH_URL:-}
      UNITED_PAYMENT_USERNAME: ${UNITED_PAYMENT_USERNAME:-}
      UNITED_PAYMENT_PASSWORD: ${UNITED_PAYMENT_PASSWORD:-}
      UNITED_PAYMENT_BASE_URL: ${UNITED_PAYMENT_BASE_URL:-}
      UNITED_PAYMENT_SUCCESS_URL: ${UNITED_PAYMENT_SUCCESS_URL:-}
      UNITED_PAYMENT_CANCEL_URL: ${UNITED_PAYMENT_CANCEL_URL:-}
      UNITED_PAYMENT_DECLINE_URL: ${UNITED_PAYMENT_DECLINE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - academor_net

  nginx:
    image: nginx:alpine
    container_name: academor_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ../academor/staticfiles:/app/academor/staticfiles:ro
      - ../academor/media:/app/academor/media:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - academor_net

volumes:
  postgres_data:

networks:
  academor_net: